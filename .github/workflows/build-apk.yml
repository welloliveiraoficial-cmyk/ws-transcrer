name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ajustar versionCode/versionName para este build
        run: |
          sed -i "s/versionCode = [0-9]\+/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"1.0.${{ github.run_number }}\"/" app/build.gradle.kts

      - name: Build APK de debug
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK com numero da versao
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ws-transcrer-v${{ github.run_number }}.apk

      - name: Publicar Release no GitHub com o APK anexado
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Ws Transcrer - build ${{ github.run_number }}"
          files: app/build/outputs/apk/debug/ws-transcrer-v${{ github.run_number }}.apk
          body: "Build automatico gerado a partir do commit ${{ github.sha }}."

      - name: Atualizar version.json com a nova versao
        run: |
          cat > version.json << EOF2
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "changelog": ["Build automatico a partir do commit ${{ github.sha }}"],
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/ws-transcrer-v${{ github.run_number }}.apk"
          }
          EOF2

      - name: Publicar version.json de volta no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Atualizar version.json para build ${{ github.run_number }} [skip ci]" || echo "Nada para commitar"
          git push
